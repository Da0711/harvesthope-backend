
spring.application.name=harvesthope

# Conexão com o SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=harvesthope;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuração do JPA e Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tratamento de erros
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-exception=false

# JWT
app.jwt.secret=${JWT_SECRET}

server.port=8081

# Configuração de e-mail de suporte
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# Destinatário dos chamados
app.suporte.email=harvesthopesuporte@gmail.com

app.admin.bootstrap=${APP_ADMIN_BOOTSTRAP:false}
app.admin.nome=${APP_ADMIN_NOME:}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.senha=${APP_ADMIN_SENHA:}