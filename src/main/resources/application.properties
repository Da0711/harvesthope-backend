
spring.application.name=harvesthope

# Conexão com o SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=harvesthope;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuração do JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Evita expor detalhes internos nas respostas de erro
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-exception=false

app.jwt.secret=${JWT_SECRET}